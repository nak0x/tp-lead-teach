<hr>

<div class="panel panel-default search-results">
  <div class="panel-heading">
    <h3 class="panel-title">Search Results</h3>
  </div>
  <div class="panel-body">

    <% if (photos.length) { %>

      <!-- Part I / V - client-driven zip: queue the job over AJAX, poll the
           status endpoint to drive the progress bar, then stream-download the
           result. Data attributes feed the script in public/js/zip.js. -->
      <div class="zip-actions" style="margin-bottom: 15px;"
        data-zip
        data-tags="<%= tagsParameter %>"
        data-tagmode="<%= tagmodeParameter %>"
        data-ready="<%= zipReady ? 'true' : 'false' %>">

        <button type="button" class="btn btn-success" data-zip-start>
          Zip first 10 photos
        </button>

        <a href="/zip/download?tags=<%= encodeURIComponent(tagsParameter) %>"
          class="btn btn-primary" data-zip-download
          style="<%= zipReady ? '' : 'display: none;' %>">
          Download zip
        </a>

        <div class="zip-progress" data-zip-progress
          style="margin-top: 12px; display: none;">
          <div class="progress progress-striped active" data-zip-track
            style="margin-bottom: 6px;">
            <div class="progress-bar" role="progressbar" data-zip-bar
              aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
              style="width: 0%; min-width: 2em;">0%</div>
          </div>
          <small class="text-muted" data-zip-status>Queued&hellip;</small>
        </div>

        <div class="alert alert-danger" data-zip-error
          style="margin-top: 12px; display: none;"></div>

      </div>


      <ul>
        <% photos.forEach(function (photo) { %>
          <li class="list-unstyled">
            <a href="<%= photo.media.b %>" class="thumbnail">
              <img src="<%= photo.media.t %>" alt="Photo - <%= photo.title %>"
                title="<%= photo.title %>">
            </a>
          </li>
        <% }) %>
      </ul>

    <% } else { %>
      <div class="alert alert-info"><strong>No results</strong></div>
    <% } %>

  </div>

</div>

<script src="js/zip.js"></script>
