  <body>
    <header class="page-header">
      <div class="container">
        <!-- Part III - Firebase Google Sign-In. Wired by public/js/firebase-auth.js -->

          <span class="text-muted" data-auth-user style="margin-right: 8px;"></span>
          <button type="button" class="btn btn-primary btn-sm" data-signin>

            Sign out
          </button>
        </div>
        <h1>Express App Testing Demo</h1>
        <p class="lead">
          <a href="coverage/lcov-report/index.html">Istanbul Code Coverage Report</a>

          <a href="https://www.flickr.com/services/feeds/docs/photos_public/" target="_blank">

        </p>
      </div>
    </header>
